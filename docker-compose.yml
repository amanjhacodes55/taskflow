services:
  app:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "php artisan migrate --force && cd public && php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      HOME: /tmp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment:
      HOME: /tmp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  queue:
    build: .
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan queue:work --tries=3
    volumes:
      - .:/var/www/html
    environment:
      HOME: /tmp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: taskflow
      DB_USERNAME: taskflow
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: taskflow
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret", "-utaskflow"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
